[project]
name = "theboard"
version = "0.1.0"
description = ""
requires-python = ">=3.13"
dependencies = [
    "django>=2.2",
    "djangoql",
    "django-extensions",
    "django-redis",
    "psycopg2-binary",
    "pytest",
    "pytest-cov",
    "shortuuid",
    "uwsgi",
    "werkzeug",
    "whitenoise",
    "django-ninja>=1.4.5",
    "typing-extensions>=4.12.2,<4.13",
    "playwright>=1.57.0",
    "axe-playwright-python>=0.1.7",
    "html5lib>=1.1",
    "tinycss2>=1.5.1",
]

[tool.uv]
dev-dependencies = [
    "ipython",
    "bpython",
    "pudb",
    "django-stubs",
    "factory-boy>=3.3.3",
    "faker>=39.0.0",
]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
lint.ignore = ["F403", "E501", "N802", "N803", "N806", "C901", "D100", "D102", "D102", "D10"]
